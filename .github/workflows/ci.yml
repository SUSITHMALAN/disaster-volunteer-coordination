name: CI Pipeline

on:
  push:
    branches: [ main, feature/*, feature-* ]
  pull_request:
    branches: [ main ]

jobs:
  python-agentic-ai:
    name: Agentic AI Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agentic-ai/requirements.txt
          pip install pytest

      - name: Run pytest
        run: |
          pytest agentic-ai/tests

  dotnet-backend:
    name: .NET Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore backend/DVC.sln || dotnet restore backend/

      - name: Build
        run: dotnet build backend/ --no-restore --configuration Release || dotnet build backend/ --configuration Release

      - name: Test
        run: dotnet test backend/ --no-build --verbosity normal || dotnet test backend/
